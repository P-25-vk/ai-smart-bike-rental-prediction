services:
  - type: web
    name: bike-rental-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: S3_BUCKET
        value: bike-rental-ml-assets
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        value: bike_rental_db
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: ALLOWED_ORIGINS
        value: "*"
