server {
    listen 80;
    server_name _;          # Replace _ with your domain or EC2 IP

    # ── React Frontend (built static files) ──────────────────────
    root /home/ubuntu/bike-rental/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Flask API (proxied to Gunicorn on port 5000) ─────────────
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Direct backend access (for development / API testing) ────
    location ~ ^/(predict|forecast|stats|operations|sustainability|maintenance|export|user|admin)/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── Gzip compression ─────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy       "strict-origin-when-cross-origin";
}
